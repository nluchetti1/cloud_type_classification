name: Update CloudScope

on:
  schedule:
    # Hourly at :10. The script deliberately takes the N-1 cycle (CYCLE_LAG_H), so this fires
    # against a run that has had ~70 minutes to post rather than one still being written.
    # Actions cron is best-effort and often slips 10-25 minutes; the lag is what makes that
    # slip harmless, so don't remove one without reconsidering the other.
    - cron: "10 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild the current cycle even if it is already published"
        type: boolean
        default: false

# One publish at a time. Concurrent runs regenerate the same PNGs with different bytes and
# collide on push.
concurrency:
  group: cloudscope-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install eccodes (pygrib needs the C library)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libeccodes0 libeccodes-dev

      - run: pip install -r requirements.txt

      # Two seconds, no network. Catches a name that no longer exists and a function whose
      # returns disagree on arity - the two ways this script has broken in production, both
      # invisible to a syntax check and both fatal on the first real run.
      - name: Static checks
        run: python _checks.py cloud_classify.py

      - name: Classify latest cycles (all models)
        env:
          # One pass builds every model in the list; the POV pools their cycles.
          #
          # hrrr  - hourly, off S3, fast. Six cycles, rebuilt every pass.
          # rrfs  - hourly deterministic, off NOMADS under a throttle. Four cycles.
          #
          # Ten time-lagged members. The five RRFS ENSEMBLE members (rrfs_m001..m005) are
          # coded and deliberately left out: measured 11 Sep 2026, neither of their published
          # products carries condensate on isobaric levels, so a member could never flag an
          # anvil and would vote GO through every Cape afternoon. They re-check every 6 h if
          # added back, and would switch on by themselves if NCEP adds the fields.
          CLOUDSCOPE_MODELS: "hrrr,rrfs"
          # Also forces a rebuild whenever RENDER_VERSION in the script has moved on.
          CLOUDSCOPE_FORCE: ${{ inputs.force && '1' || '0' }}
        run: python cloud_classify.py

      - name: Publish
        run: |
          git config user.name  "cloudscope-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A docs
          if git diff --cached --quiet; then
            echo "No change to publish."
            exit 0
          fi
          git commit -m "CloudScope $(date -u '+%Y-%m-%d %H:%MZ')"
          # This job is the only writer of docs/, and each run republishes the whole set, so
          # take ours wholesale rather than rebasing binary PNGs against a concurrent run.
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --soft "origin/${GITHUB_REF_NAME}"
          git add -A docs
          git commit -m "CloudScope $(date -u '+%Y-%m-%d %H:%MZ')" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
