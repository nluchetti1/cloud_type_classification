<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CloudScope — cloud type over the Cape</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#E9EBE4;
    --paper-2:#DFE2D9;
    --ink:#14181B;
    --ink-3:#5D6A6E;
    --rule:#C3C8BC;
    --panel:#0D1117;
    --panel-edge:#2A3442;
    --accent:#A11D33;
    --shell:1180px;      /* the map stops growing here; without this it ate the screen */
    --rail:264px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper); color:var(--ink);
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:13px; line-height:1.5;
    padding:clamp(14px,3vw,30px);
  }
  .shell{max-width:var(--shell); margin:0 auto}

  /* ---- masthead ------------------------------------------------------------ */
  header{
    display:flex; align-items:flex-end; justify-content:space-between;
    gap:18px; flex-wrap:wrap;
    border-bottom:1.5px solid var(--ink); padding-bottom:10px; margin-bottom:16px;
  }
  h1{
    font-family:"Bricolage Grotesque",system-ui,sans-serif;
    font-weight:800; font-size:clamp(26px,4.4vw,44px); line-height:.92;
    margin:0; letter-spacing:-.025em; font-variation-settings:"opsz" 72;
  }
  h1 em{font-style:normal; color:var(--ink-3)}
  .sub{font-size:11.5px; color:var(--ink-3); margin-top:5px; letter-spacing:.02em}
  .stamp{text-align:right; font-size:11.5px; color:var(--ink-3); white-space:nowrap}
  .stamp b{display:block; color:var(--ink); font-size:14px; letter-spacing:.03em}

  /* ---- layout -------------------------------------------------------------- */
  .grid{display:grid; grid-template-columns:minmax(0,1fr) var(--rail); gap:22px; align-items:start}
  .stage{min-width:0}

  /* The map is a fixed-aspect PNG, so cap it by HEIGHT and let width follow. A plain
     width:100% made it as tall as it was wide and pushed everything off-screen. */
  figure{
    margin:0; background:var(--panel); border:1px solid var(--panel-edge); border-radius:2px;
    display:flex; align-items:center; justify-content:center; position:relative;
    min-height:260px; overflow:hidden;
  }
  figure img{display:block; max-width:100%; max-height:min(70vh,660px); width:auto; height:auto}
  .loading{position:absolute; inset:0; display:grid; place-items:center;
           color:#5A6B7D; font-size:11.5px; letter-spacing:.08em}

  /* ---- transport ----------------------------------------------------------- */
  .transport{display:flex; align-items:center; gap:12px; margin-top:12px; flex-wrap:wrap}
  button{font:inherit; font-weight:600; letter-spacing:.05em; cursor:pointer;
         background:var(--ink); color:var(--paper); border:none; border-radius:2px;
         padding:7px 15px}
  button:hover{background:#2C3438}
  button:focus-visible, input:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  input[type=range]{flex:1; min-width:150px; accent-color:var(--accent)}
  .valid{font-size:15px; font-weight:600; font-variant-numeric:tabular-nums; white-space:nowrap}
  .fh{color:var(--ink-3); font-size:11.5px}

  /* ---- pads ---------------------------------------------------------------- */
  .pads{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:1px;
        margin-top:16px; background:var(--rule); border:1px solid var(--rule)}
  .pad{background:var(--paper); padding:8px 10px}
  .pad-name{font-size:10px; letter-spacing:.12em; color:var(--ink-3)}
  .pad-cls{display:flex; align-items:center; gap:6px; margin-top:4px; font-weight:600;
           font-size:12px; line-height:1.25}
  .pad-cls .chip{width:10px; height:10px; flex:none}
  .pad-num{font-size:10.5px; color:var(--ink-3); margin-top:3px;
           font-variant-numeric:tabular-nums}

  /* ---- legend rail: ordered the way the atmosphere is ---------------------- */
  .rail{border-left:1.5px solid var(--ink); padding-left:13px}
  .rail h2, .trend h2{font-size:10.5px; letter-spacing:.14em; text-transform:uppercase;
                      color:var(--ink-3); margin:0 0 2px; font-weight:500}
  .alt{font-size:10px; color:var(--ink-3); letter-spacing:.04em; margin-bottom:10px}
  .band{padding:7px 0; border-bottom:1px dotted var(--rule)}
  .band:last-of-type{border-bottom:none}
  .band-top{display:flex; align-items:center; gap:8px}
  .chip{width:12px; height:12px; border-radius:2px; flex:none;
        box-shadow:0 0 0 1px rgba(20,24,27,.22) inset}
  .band-name{font-weight:600; font-size:12px; letter-spacing:.01em}
  .band-pct{margin-left:auto; font-variant-numeric:tabular-nums; color:var(--ink-3);
            font-size:11.5px}
  .bar{height:3px; background:var(--paper-2); margin-top:5px; overflow:hidden}
  .bar span{display:block; height:100%; width:0; transition:width .28s ease}
  .band-note{font-size:10px; color:var(--ink-3); margin-top:4px; line-height:1.4}

  /* ---- coverage over time -------------------------------------------------- */
  .trend{margin-top:18px; border-top:1px solid var(--rule); padding-top:12px}
  .trend svg{width:100%; height:74px; display:block; margin-top:6px}
  footer{margin-top:20px; border-top:1px solid var(--rule); padding-top:10px;
         font-size:10.5px; color:var(--ink-3); max-width:76ch}

  @media (max-width:840px){
    .grid{grid-template-columns:1fr}
    .rail{border-left:none; border-top:1.5px solid var(--ink); padding-left:0; padding-top:12px}
    figure img{max-height:56vh}
  }
  @media (prefers-reduced-motion:reduce){ *{transition:none !important} }
</style>
</head>
<body>
<div class="shell">

<header>
  <div>
    <h1>Cloud<em>Scope</em></h1>
    <div class="sub" id="sub">Model cloud type over the Florida spaceport corridor</div>
  </div>
  <div class="stamp">
    <b id="cycle">—</b>
    <span id="generated"></span>
  </div>
</header>

<div class="grid">
  <div class="stage">
    <figure>
      <img id="frame" alt="Classified cloud type map">
      <div class="loading" id="loading">LOADING</div>
    </figure>

    <div class="transport">
      <button id="play" aria-label="Play or pause the forecast loop">PLAY</button>
      <input type="range" id="scrub" min="0" max="0" value="0" aria-label="Forecast hour">
      <span class="valid" id="valid">—</span><span class="fh" id="fh"></span>
    </div>

    <div class="pads" id="pads"></div>

    <div class="trend">
      <h2>Coverage through the forecast</h2>
      <svg id="trend" role="img" aria-label="Share of the domain by cloud type across forecast hours"></svg>
    </div>
  </div>

  <aside class="rail">
    <h2>Cloud type</h2>
    <div class="alt">highest first, reading down to the surface</div>
    <div id="bands"></div>
  </aside>
</div>

<footer id="method"></footer>
</div>

<script>
const NOTES = {
  cirrus:     "Glaciated layer topping colder than −38 °C with no convective source upwind.",
  debris:     "Same trajectory as an anvil, but the ice has thinned below 50 g/m².",
  anvil_det:  "Optically thick ice traced back along its own layer wind to a core.",
  anvil_att:  "Same, with a core inside 10 nm — still fed by its parent.",
  convective: "40 dBZ composite, or enough graupel aloft to imply an updraft.",
  tcu:        "Liquid-based layer glaciating at its top, colder than −10 °C.",
  cumulus:    "Liquid layer 3 kft deep or more, or a lumpy top over 15 km.",
  stratiform: "Flat, shallow liquid layer.",
  clear:      "No condensate in the column."
};
// top of the atmosphere -> surface
const ORDER = ["cirrus","debris","anvil_det","anvil_att","convective","tcu","cumulus","stratiform"];

let M=null, i=0, timer=null, byKey={};
const $ = id => document.getElementById(id);

fetch("manifest.json?" + Date.now())
  .then(r => r.ok ? r.json() : Promise.reject(r.status))
  .then(m => { M = m; boot(); })
  .catch(e => {
    $("loading").textContent = "NO FORECAST YET";
    $("sub").textContent = "The workflow has not published a run (" + e + ").";
  });

function boot(){
  byKey = Object.fromEntries(M.classes.map(c => [c.key, c]));
  $("cycle").textContent = M.model + " " + M.cycle;
  $("generated").textContent = "built " + M.generated;
  $("scrub").max = M.frames.length - 1;

  const t = M.thresholds;
  $("method").textContent =
    "Every grid column is split into contiguous cloud layers and the lowest and highest are "
    + "classified separately, so a shallow deck under cirrus is not read as one deep cloud. "
    + "Condensate is integrated to a path in g/m², not thresholded as a mixing ratio, because "
    + "path is what sets opacity. An anvil is identified by where it came from, not by its base "
    + "temperature: a glaciated layer topping at " + t.glaciated_c + " °C or colder, carrying "
    + t.anvil_iwp_gm2 + " g/m² of ice or more, with a convective core either inside "
    + t.attach_nm + " nm or upwind along the layer's own mean wind within " + t.anvil_tau_h
    + " h of advection. Cores are " + t.convective_dbz + " dBZ composite or " + t.graupel_gm2
    + " g/m² of graupel. Where a column qualifies as several types the more operationally "
    + "significant one is drawn.";

  $("bands").innerHTML = ORDER.map(k => {
    const c = byKey[k]; if(!c) return "";
    return `<div class="band">
      <div class="band-top">
        <span class="chip" style="background:${c.color}"></span>
        <span class="band-name">${c.name}</span>
        <span class="band-pct" id="pct-${k}">—</span>
      </div>
      <div class="bar"><span id="bar-${k}" style="background:${c.color}"></span></div>
      <div class="band-note">${NOTES[k]||""}</div>
    </div>`;
  }).join("");

  const sites = M.sites || Object.keys((M.frames[0]||{}).sites || {});
  $("pads").innerHTML = sites.map(s => `<div class="pad">
      <div class="pad-name">${s}</div>
      <div class="pad-cls"><span class="chip" id="sc-${s}"></span><span id="sn-${s}">—</span></div>
      <div class="pad-num" id="sv-${s}"></div>
    </div>`).join("");

  M.frames.forEach(f => { const im = new Image(); im.src = f.image; });   // warm the cache
  drawTrend();
  show(0);
  $("scrub").addEventListener("input", e => { stop(); show(+e.target.value); });
  $("play").addEventListener("click", () => timer ? stop() : start());
  addEventListener("keydown", e => {
    if (e.key === "ArrowRight"){ stop(); show(Math.min(i+1, M.frames.length-1)); }
    if (e.key === "ArrowLeft"){  stop(); show(Math.max(i-1, 0)); }
    if (e.key === " "){ e.preventDefault(); timer ? stop() : start(); }
  });
}

function show(n){
  i = n; const f = M.frames[n];
  $("frame").src = f.image;
  $("frame").alt = "Cloud type classification valid " + f.valid;
  $("loading").style.display = "none";
  $("valid").textContent = f.valid_short;
  $("fh").textContent = "F" + String(f.fh).padStart(2,"0");
  $("scrub").value = n;

  const total = Object.values(f.counts).reduce((a,b) => a+b, 0) || 1;
  ORDER.forEach(k => {
    if(!$("pct-"+k)) return;
    const pct = 100 * (f.counts[k]||0) / total;
    $("pct-"+k).textContent = pct > 0 && pct < 0.05 ? "<0.1%" : pct.toFixed(1) + "%";
    // sqrt keeps the small-but-real categories visible next to a sky full of one thing
    $("bar-"+k).style.width = Math.min(100, Math.sqrt(pct/100)*100) + "%";
  });

  Object.entries(f.sites || {}).forEach(([s,d]) => {
    const c = byKey[d.key]; if(!$("sn-"+s)) return;
    $("sc-"+s).style.background = c ? c.color : "transparent";
    $("sn-"+s).textContent = c ? c.name : d.key;
    $("sv-"+s).textContent = d.top_kft == null ? "no cloud"
      : `top ${d.top_kft.toFixed(1)} kft / ${d.top_c.toFixed(0)} °C`
        + (d.iwp >= 5 ? ` · ${d.iwp.toFixed(0)} g/m² ice` : "")
        + (d.dbz >= 5 ? ` · ${d.dbz.toFixed(0)} dBZ` : "");
  });

  $("trend").querySelectorAll(".cursor").forEach(el =>
    el.setAttribute("x", (n/Math.max(1,M.frames.length-1))*100 + "%"));
}

function start(){ $("play").textContent = "PAUSE";
  timer = setInterval(() => show((i+1) % M.frames.length), 700); }
function stop(){ if(timer) clearInterval(timer); timer = null; $("play").textContent = "PLAY"; }

function drawTrend(){
  const svg = $("trend"), W = 100, H = 74, n = M.frames.length;
  const share = M.frames.map(f => {
    const tot = Object.values(f.counts).reduce((a,b)=>a+b,0) || 1;
    return Object.fromEntries(ORDER.map(k => [k, (f.counts[k]||0)/tot]));
  });
  const peak = Math.max(0.02, ...share.map(s => Math.max(...ORDER.map(k => s[k]))));
  const x = j => n<2 ? 0 : (j/(n-1))*W;
  const y = v => H - 12 - (v/peak)*(H-20);
  let out = `<line x1="0" y1="${H-12}" x2="${W}" y2="${H-12}" stroke="#C3C8BC" stroke-width=".4" vector-effect="non-scaling-stroke"/>`;
  ORDER.forEach(k => {
    if(!byKey[k]) return;
    const d = share.map((s,j) => `${j?"L":"M"}${x(j).toFixed(2)},${y(s[k]).toFixed(2)}`).join("");
    out += `<path d="${d}" fill="none" stroke="${byKey[k].color}" stroke-width="1.6"
             vector-effect="non-scaling-stroke" stroke-linejoin="round"/>`;
  });
  out += `<rect class="cursor" x="0" y="0" width="0.6" height="${H-12}" fill="#14181B" opacity=".55"/>`;
  M.frames.forEach((f,j) => { if (j % Math.ceil(n/6) === 0)
    out += `<text x="${x(j)}" y="${H-2}" font-size="5.5" fill="#5D6A6E"
             font-family="IBM Plex Mono, monospace" text-anchor="middle">${f.valid_short}</text>`; });
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("preserveAspectRatio", "none");
  svg.innerHTML = out;
}
</script>
</body>
</html>
