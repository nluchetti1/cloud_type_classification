<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CloudScope — cloud type over the Cape</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#E9EBE4;      /* plotting paper */
    --paper-2:#DFE2D9;
    --ink:#14181B;
    --ink-3:#5D6A6E;
    --rule:#C3C8BC;
    --panel:#0D1117;      /* the map's own sky */
    --panel-edge:#2A3442;
    --stratiform:#5C7A99;
    --cumulus:#D9A441;
    --convective:#A11D33;
    --anvil:#E2703A;
    --cirrus:#BFD3E6;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper); color:var(--ink);
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:13px; line-height:1.5;
    padding:clamp(14px,3vw,34px);
  }

  /* ---- masthead ------------------------------------------------------------ */
  header{
    display:flex; align-items:flex-end; justify-content:space-between;
    gap:18px; flex-wrap:wrap;
    border-bottom:1.5px solid var(--ink); padding-bottom:10px; margin-bottom:18px;
  }
  h1{
    font-family:"Bricolage Grotesque",system-ui,sans-serif;
    font-weight:800; font-size:clamp(28px,5.2vw,52px); line-height:.92;
    margin:0; letter-spacing:-.025em; font-variation-settings:"opsz" 72;
  }
  h1 em{font-style:normal; color:var(--ink-3)}
  .sub{font-size:11.5px; color:var(--ink-3); margin-top:5px; letter-spacing:.02em}
  .stamp{text-align:right; font-size:11.5px; color:var(--ink-3); white-space:nowrap}
  .stamp b{display:block; color:var(--ink); font-size:14px; letter-spacing:.03em}

  /* ---- layout -------------------------------------------------------------- */
  .grid{display:grid; grid-template-columns:minmax(0,1fr) 232px; gap:22px; align-items:start}
  @media (max-width:820px){
    .grid{grid-template-columns:1fr}
    .grid > div{display:contents}          /* let map / column / trend order independently */
    figure{order:1} .transport{order:2} .column{order:3; border-left:none;
      border-top:1.5px solid var(--ink); padding-left:0; padding-top:12px; margin-top:16px}
    .trend{order:4}
  }

  figure{margin:0; background:var(--panel); border:1px solid var(--panel-edge); border-radius:2px;
         overflow:hidden; position:relative}
  figure img{display:block; width:100%; height:auto}
  .loading{position:absolute; inset:0; display:grid; place-items:center;
           color:#5A6B7D; font-size:11.5px; letter-spacing:.08em}

  /* ---- the column: cloud types stacked as they occur in the atmosphere ----- */
  .column{border-left:1.5px solid var(--ink); padding-left:13px; position:relative}
  .column h2{font-size:10.5px; letter-spacing:.14em; text-transform:uppercase;
             color:var(--ink-3); margin:0 0 2px; font-weight:500}
  .alt{font-size:10px; color:var(--ink-3); letter-spacing:.04em; margin-bottom:12px}
  .band{padding:9px 0; border-bottom:1px dotted var(--rule)}
  .band:last-of-type{border-bottom:none}
  .band-top{display:flex; align-items:center; gap:8px}
  .chip{width:13px; height:13px; border-radius:2px; flex:none;
        box-shadow:0 0 0 1px rgba(20,24,27,.22) inset}
  .band-name{font-weight:600; letter-spacing:.01em}
  .band-pct{margin-left:auto; font-variant-numeric:tabular-nums; color:var(--ink-3)}
  .bar{height:3px; background:var(--paper-2); margin-top:6px; overflow:hidden}
  .bar span{display:block; height:100%; width:0; transition:width .28s ease}
  .band-note{font-size:10px; color:var(--ink-3); margin-top:5px; line-height:1.45}

  /* ---- transport ----------------------------------------------------------- */
  .transport{display:flex; align-items:center; gap:12px; margin-top:14px; flex-wrap:wrap}
  button{font:inherit; font-weight:600; letter-spacing:.05em; cursor:pointer;
         background:var(--ink); color:var(--paper); border:none; border-radius:2px;
         padding:7px 15px}
  button:hover{background:#2C3438}
  button:focus-visible, input:focus-visible{outline:2px solid var(--convective); outline-offset:2px}
  input[type=range]{flex:1; min-width:180px; accent-color:var(--convective)}
  .valid{font-size:15px; font-weight:600; font-variant-numeric:tabular-nums; white-space:nowrap}
  .fh{color:var(--ink-3); font-size:11.5px}

  /* ---- coverage over time -------------------------------------------------- */
  .trend{margin-top:20px; border-top:1px solid var(--rule); padding-top:12px}
  .trend h2{font-size:10.5px; letter-spacing:.14em; text-transform:uppercase;
            color:var(--ink-3); margin:0 0 8px; font-weight:500}
  .trend svg{width:100%; height:74px; display:block}
  footer{margin-top:22px; border-top:1px solid var(--rule); padding-top:10px;
         font-size:10.5px; color:var(--ink-3); max-width:74ch}
  @media (prefers-reduced-motion:reduce){ *{transition:none !important} }
</style>
</head>
<body>

<header>
  <div>
    <h1>Cloud<em>Scope</em></h1>
    <div class="sub" id="sub">Model cloud type over the Florida spaceport corridor</div>
  </div>
  <div class="stamp">
    <b id="cycle">—</b>
    <span id="generated"></span>
  </div>
</header>

<div class="grid">
  <div>
    <figure>
      <img id="frame" alt="Classified cloud type map">
      <div class="loading" id="loading">LOADING</div>
    </figure>
    <div class="transport">
      <button id="play" aria-label="Play or pause the forecast loop">PLAY</button>
      <input type="range" id="scrub" min="0" max="0" value="0" aria-label="Forecast hour">
      <span class="valid" id="valid">—</span><span class="fh" id="fh"></span>
    </div>
    <div class="trend">
      <h2>Coverage through the forecast</h2>
      <svg id="trend" role="img" aria-label="Share of the domain by cloud type across forecast hours"></svg>
    </div>
  </div>

  <!-- Ordered the way the atmosphere is: layered cloud at the bottom, ice at the top. -->
  <aside class="column">
    <h2>Cloud type</h2>
    <div class="alt">highest first, reading down to the surface</div>
    <div id="bands"></div>
  </aside>
</div>

<footer id="method"></footer>

<script>
const NOTES = {
  stratiform: "Layered liquid cloud, under 8 kft deep.",
  cumulus:    "Liquid-based and 8 kft deep or more — vertically developed.",
  convective: "Composite reflectivity at or above 40 dBZ.",
  anvil:      "Ice cloud based colder than −20 °C with a convective core upwind along the 300–150 mb flow.",
  cirrus:     "Ice cloud with no convective source upwind.",
  clear:      "No condensate in the column."
};
// bottom -> top, matching where each type lives in the atmosphere
const ORDER = ["stratiform","cumulus","convective","anvil","cirrus"];

let M=null, i=0, timer=null;
const $ = id => document.getElementById(id);

// The viewer works whether it sits alongside the data (Pages serving /docs) or one level
// above it (Pages serving the repo root). Try both, and remember which one won so the image
// paths in the manifest resolve against the right base.
let BASE = "";
const CANDIDATES = ["", "docs/"];

(function load(k){
  if (k >= CANDIDATES.length){
    $("loading").textContent = "NO FORECAST YET";
    $("sub").innerHTML = "Couldn't find <code>manifest.json</code> here or in <code>docs/</code>. "
      + "Publish a run, or check that GitHub Pages is serving the folder that contains it.";
    return;
  }
  fetch(CANDIDATES[k] + "manifest.json?" + Date.now())
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(m => { BASE = CANDIDATES[k]; M = m; boot(); })
    .catch(() => load(k + 1));
})(0);

function boot(){
  $("cycle").textContent = M.model + " " + M.cycle;
  $("generated").textContent = "built " + M.generated;
  $("scrub").max = M.frames.length - 1;
  const t = M.thresholds;
  $("method").textContent =
    "Each grid column is classified from the model's own condensate fields — cloud water and cloud ice — "
    + "rather than a humidity threshold, so the liquid/ice split is the model's, not an inference. "
    + "Cloud is condensate above " + t.qc_min_kgkg + " kg/kg; a column counts as glaciated at "
    + (t.ice_fraction*100) + "% ice or more; " + t.deep_kft + " kft of depth separates cumulus from "
    + "layered cloud; " + t.convective_dbz + " dBZ marks a convective core; an anvil needs a base colder than "
    + t.anvil_base_c + " °C and a core within " + t.anvil_reach_nm + " nm upwind. "
    + "Where a column qualifies as several types the more operationally significant one is drawn.";

  const byKey = Object.fromEntries(M.classes.map(c => [c.key, c]));
  $("bands").innerHTML = ORDER.slice().reverse().map(k => {
    const c = byKey[k];
    return `<div class="band">
      <div class="band-top">
        <span class="chip" style="background:${c.color}"></span>
        <span class="band-name">${c.name}</span>
        <span class="band-pct" id="pct-${k}">—</span>
      </div>
      <div class="bar"><span id="bar-${k}" style="background:${c.color}"></span></div>
      <div class="band-note">${NOTES[k]}</div>
    </div>`;
  }).join("");

  M.frames.forEach(f => { const im = new Image(); im.src = BASE + f.image; });   // warm the cache
  drawTrend();
  show(0);
  $("scrub").addEventListener("input", e => { stop(); show(+e.target.value); });
  $("play").addEventListener("click", () => timer ? stop() : start());
  addEventListener("keydown", e => {
    if (e.key === "ArrowRight"){ stop(); show(Math.min(i+1, M.frames.length-1)); }
    if (e.key === "ArrowLeft"){  stop(); show(Math.max(i-1, 0)); }
    if (e.key === " "){ e.preventDefault(); timer ? stop() : start(); }
  });
}

function show(n){
  i = n; const f = M.frames[n];
  $("frame").src = BASE + f.image;
  $("frame").alt = "Cloud type classification valid " + f.valid;
  $("loading").style.display = "none";
  $("valid").textContent = f.valid_short;
  $("fh").textContent = "F" + String(f.fh).padStart(2,"0");
  $("scrub").value = n;
  const total = Object.values(f.counts).reduce((a,b) => a+b, 0) || 1;
  ORDER.forEach(k => {
    const pct = 100 * (f.counts[k]||0) / total;
    $("pct-"+k).textContent = pct < 0.05 && pct > 0 ? "<0.1%" : pct.toFixed(1) + "%";
    // sqrt keeps the small-but-real categories visible next to a sky full of one thing
    $("bar-"+k).style.width = Math.min(100, Math.sqrt(pct/100)*100) + "%";
  });
  $("trend").querySelectorAll(".cursor").forEach(el =>
    el.setAttribute("x", (n/Math.max(1,M.frames.length-1))*520 - 1));
}

function start(){ $("play").textContent = "PAUSE";
  timer = setInterval(() => show((i+1) % M.frames.length), 700); }
function stop(){ if(timer) clearInterval(timer); timer = null; $("play").textContent = "PLAY"; }

function drawTrend(){
  const svg = $("trend"), W = 520, H = 74, n = M.frames.length;
  const byKey = Object.fromEntries(M.classes.map(c => [c.key, c]));
  const share = M.frames.map(f => {
    const tot = Object.values(f.counts).reduce((a,b)=>a+b,0) || 1;
    return Object.fromEntries(ORDER.map(k => [k, (f.counts[k]||0)/tot]));
  });
  const peak = Math.max(0.02, ...share.map(s => Math.max(...ORDER.map(k => s[k]))));
  const x = j => n<2 ? 0 : (j/(n-1))*W;
  const y = v => H - 12 - (v/peak)*(H-20);
  let out = `<line x1="0" y1="${H-12}" x2="${W}" y2="${H-12}" stroke="#C3C8BC" stroke-width=".4" vector-effect="non-scaling-stroke"/>`;
  ORDER.forEach(k => {
    const d = share.map((s,j) => `${j?"L":"M"}${x(j).toFixed(2)},${y(s[k]).toFixed(2)}`).join("");
    out += `<path d="${d}" fill="none" stroke="${byKey[k].color}" stroke-width="1.6"
             vector-effect="non-scaling-stroke" stroke-linejoin="round"/>`;
  });
  out += `<rect class="cursor" x="0" y="0" width="2" height="${H-12}" fill="#14181B" opacity=".55"/>`;
  const every = Math.max(1, Math.ceil(n/6));
  M.frames.forEach((f,j) => { if (j % every === 0)
    out += `<text x="${x(j).toFixed(1)}" y="${H-2}" font-size="9" fill="#5D6A6E"
             font-family="IBM Plex Mono, monospace" text-anchor="middle">${f.valid_short}</text>`; });
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
  svg.innerHTML = out;
}
</script>
</body>
</html>
